name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed semantic version tag (must match VERSION)
        required: true
        default: v0.1.0-rc.1
        type: string
      publish:
        description: Request public release after configured review gates
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed semantic tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag' }
          if ($env:TAG -ne ('v'+(Get-Content VERSION -Raw).Trim())) { throw 'Tag differs from VERSION' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify compiler
        run: . ./scripts/Setup-Toolchain.ps1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - name: Validate source, regressions and vulnerabilities
        run: |
          python scripts/audit_publication.py --history
          if ($LASTEXITCODE) { throw 'Source policy failed' }
          ./scripts/Test-Windows.ps1
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags cli ./...
          if ($LASTEXITCODE) { throw 'CLI vulnerability scan failed' }
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          if ($LASTEXITCODE) { throw 'GUI vulnerability scan failed' }
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --log-opts='--all --full-history' --redact
          if ($LASTEXITCODE) { throw 'Secret scan failed' }
      - name: Build corresponding source and binary packages
        run: |
          python scripts/collect_licenses.py
          git diff --exit-code -- third_party go.mod go.sum
          if ($LASTEXITCODE) { throw 'Notice/lockfile drift' }
          ./scripts/Build-Windows.ps1
          python scripts/package_release.py
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          python scripts/verify_distribution.py dist
          if ($LASTEXITCODE) { throw 'Artifact verification failed' }
          Copy-Item docs/RELEASE_NOTES.md dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reviewed
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
  publish:
    needs: prepare
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.ENABLE_RELEASE_PUBLISHING == 'true')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce owner-configured publication gate
        run: python3 scripts/audit_publication.py --release-gate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-reviewed
          path: release-assets
      - name: Publish approved version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS.txt
          args=()
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          if [[ "$EVENT" != "workflow_dispatch" ]]; then args+=(--verify-tag); fi
          gh release create "$TAG" --repo "$REPO" --target "$TARGET" --title "Equilotl Portable $TAG" --notes-file RELEASE_NOTES.md "${args[@]}" ./*.zip SHA256SUMS.txt
